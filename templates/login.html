<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pune Seva</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Full-Page Background Image */
        body {
            background: url("{{ url_for('static', filename='parallax.jpg') }}") no-repeat center center;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Semi-Transparent Overlay */
        .overlay {
            background-color: rgba(0, 0, 0, 0.5);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Login Form Box */
        .login-form {
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
            border: 2px solid #9DBFAF; /* Sage Green border */
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }

        /* Logo */
        .logo-container img {
            max-width: 150px;
            margin-bottom: 20px;
        }

        /* Fade-in Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Fields */
        .form-control:focus {
            border-color: #EABDA8; /* Soft Peach */
            box-shadow: none;
        }

        /* Buttons */
        .btn-custom {
            background-color: #EABDA8; /* Soft Peach */
            color: white;
            border-radius: 12px;
            font-family: 'Merriweather', serif;
            font-size: 1.1rem;
            padding: 10px 20px;
            transition: background-color 0.3s ease;
            border: none;
        }

        .btn-custom:hover {
            background-color: #356E6B; /* Deep Teal */
        }

        .btn-register {
            background-color: #9DBFAF; /* Sage Green */
        }

        .btn-register:hover {
            background-color: #356E6B;
        }

        /* OAuth Buttons */
        .oauth-buttons a {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background-color: #9DBFAF;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: background-color 0.3s ease;
            margin-bottom: 10px;
        }

        .oauth-buttons a:hover {
            background-color: #356E6B;
        }

        .oauth-buttons img {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

<!-- Dark Overlay to Improve Contrast -->
<div class="overlay"></div>

<!-- Login Box -->
<div class="login-form">
    <div class="logo-container text-center">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Pune Seva Logo">
    </div>
    <h2>Sign In</h2>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alert-container">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="post">
        <div class="mb-3">
            <label for="username_or_email" class="form-label">Username or Email</label>
            <input type="text" class="form-control" id="username_or_email" name="username_or_email" placeholder="Enter your username or email" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-custom w-100 mb-3">Sign In</button>
    </form>

    <a href="{{ url_for('register') }}" class="btn btn-custom btn-register w-100 mb-3">Register / Sign Up</a>

    <!-- OAuth Buttons -->
    <div class="oauth-buttons">
        <a href="/auth/facebook">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook Logo"> Login with Facebook
        </a>
        <a href="/auth/google">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo"> Login with Google
        </a>
    </div>
</div>

<!-- Footer -->
<footer>
    PuneSeva &copy; 2025
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script>
     // Auto-hide flash messages after 2 seconds
     setTimeout(function() {
        var alerts = document.querySelectorAll('.alert');
        alerts.forEach(function(alert) {
            var alertInstance = bootstrap.Alert.getInstance(alert);
            if (alertInstance) {
                alertInstance.close();
            }}, 2000); // 2 seconds
    });
</script>

</body>
</html>
