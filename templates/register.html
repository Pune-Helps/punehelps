<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pune Seva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .image-side {
            background: url("{{ url_for('static', filename='register-bg.jpg') }}") no-repeat center center;
            background-size: cover;
        }

        .register-form {
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
            border: 2px solid #9DBFAF;
        }

        .register-form h2 {
            margin-bottom: 20px;
            font-family: 'Merriweather', serif;
            color: #36454F;
        }

        .form-control:focus {
            border-color: #EABDA8;
            box-shadow: none;
        }

        .btn-custom {
            background-color: #EABDA8;
            color: white;
            border-radius: 12px;
            font-family: 'Merriweather', serif;
            font-size: 1.1rem;
            padding: 10px 20px;
            transition: background-color 0.3s ease;
            border: none;
        }

        .btn-custom:hover {
            background-color: #356E6B;
        }

        .btn-register {
            background-color: #9DBFAF;
        }

        .btn-register:hover {
            background-color: #356E6B;
        }

        .oauth-buttons a {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background-color: #9DBFAF;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: background-color 0.3s ease;
            margin-bottom: 10px;
        }

        .oauth-buttons a:hover {
            background-color: #356E6B;
        }

        .oauth-buttons img {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
<div class="container-fluid register-container">
    <div class="row g-0 w-100">
        <div class="col-md-6 image-side d-none d-md-block"></div>

        <!-- Form Side -->
        <div class="col-md-6 d-flex justify-content-center align-items-center">
            <div class="register-form text-center">
                <h2>Register</h2>

                <!-- Flash Messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="alert-container">
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <form action="{{ url_for('register') }}" method="post">
                    <input type="email" class="form-control mb-3" id="email" name="email" placeholder="Email" required>
                    <input type="text" class="form-control mb-3" id="username" name="username" placeholder="Username" required>
                    <input type="date" class="form-control mb-3" id="birthdate" name="birthdate" required>
                    
                    <select class="form-select mb-3" id="govt_id_type" name="govt_id_type">
                        <option value="" selected disabled>Select ID Type</option>
                        <option value="Aadhar">Aadhar Card</option>
                        <option value="PAN">PAN Card</option>
                        <option value="Voter">Voter ID</option>
                        <option value="Driving License">Driving License</option>
                        <option value="Passport">Passport</option>
                    </select>

                    <input type="password" class="form-control mb-3" id="password" name="password" placeholder="Password" required>
                    <input type="password" class="form-control mb-3" id="confirm_password" placeholder="Confirm Password" required>
                    
                    <button type="submit" class="btn btn-custom w-100 mb-3">Register</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelector("form").addEventListener("submit", function (event) {
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm_password").value;
        if (password !== confirmPassword) {
            event.preventDefault();
            alert("Passwords do not match!");
        }
    });
</script>

</body>
</html>
