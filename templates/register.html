<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pune Seva</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Full-Page Background Image */
        body {
            background: url("{{ url_for('static', filename='parallax.jpg') }}") no-repeat center center;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Semi-Transparent Overlay */
        .overlay {
            background-color: rgba(0, 0, 0, 0.5);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Register Form Box */
        .register-form {
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
            border: 2px solid #9DBFAF; /* Sage Green border */
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }

        /* Logo */
        .logo-container img {
            max-width: 150px;
            margin-bottom: 20px;
        }

        /* Fade-in Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Fields */
        .form-control:focus {
            border-color: #EABDA8; /* Soft Peach */
            box-shadow: none;
        }

        /* Buttons */
        .btn-custom {
            background-color: #EABDA8; /* Soft Peach */
            color: white;
            border-radius: 12px;
            font-family: 'Merriweather', serif;
            font-size: 1.1rem;
            padding: 10px 20px;
            transition: background-color 0.3s ease;
            border: none;
        }

        .btn-custom:hover {
            background-color: #356E6B; /* Deep Teal */
        }

        .btn-register {
            background-color: #9DBFAF; /* Sage Green */
        }

        .btn-register:hover {
            background-color: #356E6B;
        }

        /* OAuth Buttons */
        .oauth-buttons a {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background-color: #9DBFAF;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: background-color 0.3s ease;
            margin-bottom: 10px;
        }

        .oauth-buttons a:hover {
            background-color: #356E6B;
        }

        .oauth-buttons img {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-label {
            color: #36454F;
            font-weight: 500;
        }
    </style>
</head>
<body>
<!-- Dark Overlay to Improve Contrast -->
<div class="overlay"></div>

<!-- Register Box -->
<div class="register-form">
    <div class="logo-container text-center">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Pune Seva Logo">
    </div>
    <h2>Create Account</h2>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alert-container">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
                <form action="{{ url_for('register') }}" method="post">
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="birthdate" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="birthdate" name="birthdate" required>
                    </div>
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="govt_id_type" class="form-label">Government ID Type</label>
                        <select class="form-select" id="govt_id_type" name="govt_id_type" required>
                            <option value="" selected disabled>Select ID Type</option>
                            <option value="Aadhar">Aadhar Card</option>
                            <option value="PAN">PAN Card</option>
                            <option value="Voter">Voter ID</option>
                            <option value="Driving License">Driving License</option>
                            <option value="Passport">Passport</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="govt_id_number" class="form-label">Government ID Number</label>
                        <input type="text" class="form-control" id="govt_id_number" name="govt_id_number" required>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="phone_number" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone_number" name="phone_number" required>
                    </div>
                    <button type="submit" class="btn btn-custom w-100 mb-3">Create Account</button>
                </form>

                <a href="{{ url_for('login') }}" class="btn btn-custom btn-register w-100 mb-3">Already have an account? Sign In</a>

                <!-- OAuth Buttons -->
                <div class="oauth-buttons">
                    <a href="/auth/facebook">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook Logo"> Register with Facebook
                    </a>
                    <a href="/auth/google">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo"> Register with Google
                    </a>
                </div>
            </div>

<!-- Footer -->
<footer>
    PuneSeva &copy; 2025
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
            document.querySelectorAll(".alert").forEach(function (alert) {
                alert.classList.remove("show"); // Hide the alert smoothly
            });
        }, 3000); // Extended to 3 seconds
    });
</script>

</body>
</html>
